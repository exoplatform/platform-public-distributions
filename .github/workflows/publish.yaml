name: Create and publish a eXo Community binary

on:
  push:
    tags:
      - '[6-9].[0-9].[0-9]'
env:
  DOWNLOAD_URL: 'https://repository.exoplatform.org/content/groups/public/org/exoplatform/platform/distributions/plf-community-tomcat-standalone'
  DOWNLOAD_BINARY_PREFFIX: 'plf-community-tomcat-standalone'
  DOWNLOAD_BINARY_ZIP_FOLDER_PREFIX: 'platform-community'
  SF_HOST: 'frs.sourceforge.net'
  SF_PROJECT: 'exo'
jobs:
  publish:
    name: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Release version
        run: |
           echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Download eXo Community binary from Nexus
        run: |
            set -euo pipefail
            curl -fsSL "${DOWNLOAD_URL}/${RELEASE_VERSION}/${DOWNLOAD_BINARY_PREFFIX}-${RELEASE_VERSION}.zip" -o "${DOWNLOAD_BINARY_PREFFIX}-${RELEASE_VERSION}.zip"
            unzip -j "${DOWNLOAD_BINARY_PREFFIX}-${RELEASE_VERSION}.zip" "${DOWNLOAD_BINARY_ZIP_FOLDER_PREFIX}-${RELEASE_VERSION}/CHANGE_LOG.txt"

            grep -qiP '^-\s*feat:' CHANGE_LOG.txt && HAS_FEATURE=true || HAS_FEATURE=false
            grep -qiP '^-\s*fix:'  CHANGE_LOG.txt && HAS_FIX=true     || HAS_FIX=false

            {
              echo "## What's Changed"
              if $HAS_FEATURE; then
                echo "Features:"
                grep -iP '^-\s*feat:' CHANGE_LOG.txt | sed -E 's/^-/*/'
                echo ""
              fi
              if $HAS_FIX; then
                echo "Bug fixes:"
                grep -iP '^-\s*fix:' CHANGE_LOG.txt | sed -E 's/^-/*/'
              fi
            } > WHATSCHANGED.TXT

            {
              echo '<h2>What'"'"'s Changed</h2>'
              if $HAS_FEATURE; then
                echo '<h3>Features:</h3><ul>'
                grep -iP '^-\s*feat:' CHANGE_LOG.txt | sed -E -e 's/[<>]//g' -e 's|^-|<li>|' -e 's|$|</li>|'
                echo '</ul>'
              fi
              if $HAS_FIX; then
                echo '<h3>Bug fixes:</h3><ul>'
                grep -iP '^-\s*fix:' CHANGE_LOG.txt | sed -E -e 's/[<>]//g' -e 's|^-|<li>|' -e 's|$|</li>|'
                echo '</ul>'
              fi
            } > README.md

            rm -v CHANGE_LOG.txt
      - name: Create immutable release and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            --title "${RELEASE_VERSION}" \
            --notes-file WHATSCHANGED.TXT \
            --verify-tag \
            "${DOWNLOAD_BINARY_PREFFIX}-${RELEASE_VERSION}.zip"
      - name: Upload to SF 
        run: |
          mv ${{ env.DOWNLOAD_BINARY_PREFFIX }}-${{ env.RELEASE_VERSION }}.zip eXo-Platform-${{ env.RELEASE_VERSION }}.zip
          echo "${{ secrets.SF_SSH_KEY }}" > /tmp/sshkey
          chmod 0600 /tmp/sshkey
          rsync -avP -e 'ssh -i /tmp/sshkey -o StrictHostKeyChecking=no' eXo-Platform-${{ env.RELEASE_VERSION }}.zip README.md ${{ secrets.SF_USERNAME }}@${{ env.SF_HOST }}:/home/frs/p/${{ env.SF_PROJECT }}/${{ env.RELEASE_VERSION }}